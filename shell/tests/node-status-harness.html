<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node Status Menu Harness</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: #111; }
      .statusbar { height: 24px; position: fixed; bottom: 0; left: 0; right: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from 'vue'
      import '/src/styles/workbench.css'
      import NodeStatusMenu from '/src/components/NodeStatusMenu.vue'
      import { store } from '/src/stores/app'

      store.paired = false
      store.deviceId = ''
      store.nodeConnected = false
      store.pairingModalOpen = false

      window.setPaired = () => { store.paired = true; store.deviceId = 'test-device' }

      createApp({
        render() {
          return h('div', { class: 'statusbar' }, [
            h(NodeStatusMenu),
            h('output', { id: 'pairing-state' }, String(store.pairingModalOpen)),
          ])
        },
      }).mount('#app')
    </script>
  </body>
</html>
