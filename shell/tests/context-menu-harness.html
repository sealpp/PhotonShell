<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextMenu Harness</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: #111; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from 'vue'
      import ContextMenu from '/src/components/ContextMenu.vue'

      const command = (id, label, options = {}) => ({
        id,
        label,
        disabled: false,
        checked: false,
        ...options,
      })

      const items = [
        command('root.submenu', '一级子菜单', {
          children: [
            command('second.disabled', '禁用项', { disabled: true }),
            command('second.leaf', '二级普通项', { action: () => {} }),
            command('second.submenu', '二级子菜单', {
              children: [
                command('third.disabled', '三级禁用项', { disabled: true }),
                command('third.first', '三级第一项', { action: () => {} }),
                command('third.second', '三级第二项', { action: () => {} }),
              ],
            }),
          ],
        }),
        command('root.leaf', '一级普通项', { action: () => {} }),
      ]

      createApp({
        data: () => ({ open: true }),
        render() {
          if (!this.open) return null
          return h(ContextMenu, {
            items,
            x: 40,
            y: 40,
            onClose: () => { this.open = false },
          })
        },
      }).mount('#app')
    </script>
  </body>
</html>
