<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connections Tree Harness</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: #1e1e1e; }
      #app { width: 360px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from 'vue'
      import '/src/styles/workbench.css'
      import '/src/services/actions'
      import ConnectionsPanel from '/src/views/ConnectionsPanel.vue'
      import FolderDialog from '/src/components/FolderDialog.vue'
      import FolderDeleteConfirm from '/src/components/FolderDeleteConfirm.vue'
      import { saveFolder, saveHost } from '/src/services/storage'

      await Promise.all([
        saveFolder({ id: 'folder-z', name: 'Zeta', parentId: null }),
        saveFolder({ id: 'folder-a', name: 'Alpha', parentId: null }),
        saveFolder({ id: 'folder-child', name: 'Nested', parentId: 'folder-a' }),
        saveHost({ id: 'host-root', name: 'Root host', address: '10.0.0.1', port: 22, username: 'root', folderId: null }),
        saveHost({ id: 'host-alpha', name: 'Alpha host', address: '10.0.0.2', port: 2200, username: 'admin', folderId: 'folder-a' }),
        saveHost({ id: 'host-nested', name: '', address: '10.0.0.3', port: 22, username: 'root', folderId: 'folder-child' }),
      ])
      import { store } from '/src/stores/app'

      store.folders = [
        { id: 'folder-z', name: 'Zeta', parentId: null },
        { id: 'folder-a', name: 'Alpha', parentId: null },
        { id: 'folder-child', name: 'Nested', parentId: 'folder-a' },
      ]
      store.hosts = [
        { id: 'host-root', name: 'Root host', address: '10.0.0.1', port: 22, username: 'root', folderId: null },
        { id: 'host-alpha', name: 'Alpha host', address: '10.0.0.2', port: 2200, username: 'admin', folderId: 'folder-a' },
        { id: 'host-nested', name: '', address: '10.0.0.3', port: 22, username: 'root', folderId: 'folder-child' },
      ]
      store.expandedFolderIds = new Set(['folder-a', 'folder-child'])
      store.selectedNodeIds = new Set()
      store.selectedHostIds = new Set()
      store.folderModalOpen = false
      store.deleteFolderConfirmOpen = false
      store.connectionModalOpen = false

      createApp({
        render() {
          return h('div', [
            h(ConnectionsPanel),
            store.folderModalOpen ? h(FolderDialog) : null,
            store.deleteFolderConfirmOpen ? h(FolderDeleteConfirm) : null,
          ])
        },
      }).mount('#app')
    </script>
  </body>
</html>
