syntax = "proto3";

package photon;

message PhotonMessage {
  uint32 protocol_version = 1;
  string request_id = 2;

  oneof body {
    PairBegin pair_begin = 10;
    PairChallenge pair_challenge = 11;
    PairProof pair_proof = 12;
    PairSucceeded pair_succeeded = 13;

    AuthBegin auth_begin = 20;
    AuthChallenge auth_challenge = 21;
    AuthProof auth_proof = 22;
    AuthSucceeded auth_succeeded = 23;

    TransportOpenRequest transport_open_request = 30;
    TransportOpenedEvent transport_opened_event = 31;
    TransportData transport_data = 32;
    TransportCredit transport_credit = 33;
    TransportHalfCloseRequest transport_half_close_request = 34;
    TransportCloseRequest transport_close_request = 35;
    TransportClosedEvent transport_closed_event = 36;
    TransportErrorEvent transport_error_event = 37;
  }
}

message PairBegin {
  string pairing_code = 1;
  string device_id = 2;
  string device_name = 3;
  bytes device_public_key = 4;
  bytes client_nonce = 5;
}

message PairChallenge {
  string pairing_id = 1;
  string node_id = 2;
  bytes node_public_key = 3;
  bytes node_nonce = 4;
}

message PairProof {
  string pairing_id = 1;
  bytes device_signature = 2;
}

message PairSucceeded {
  string device_id = 1;
  string node_id = 2;
  bytes node_public_key = 3;
}

message AuthBegin {
  string device_id = 1;
  string connection_id = 2;
  bytes client_nonce = 3;
}

message AuthChallenge {
  string connection_id = 1;
  string node_id = 2;
  bytes node_public_key = 3;
  bytes node_nonce = 4;
  bytes node_signature = 5;
}

message AuthProof {
  string connection_id = 1;
  bytes device_signature = 2;
}

message AuthSucceeded {
  string device_id = 1;
  string node_id = 2;
}

message TransportOpenRequest {
  uint32 stream_id = 1;
  string transport = 2;
  string host = 3;
  uint32 port = 4;
}

message TransportOpenedEvent {
  uint32 stream_id = 1;
  string transport = 2;
  uint64 input_credit_bytes = 3;
  uint64 output_credit_bytes = 4;
}

message TransportData {
  uint32 stream_id = 1;
  uint64 sequence = 2;
  bytes payload = 3;
}

message TransportCredit {
  uint32 stream_id = 1;
  string direction = 2;
  uint64 add_bytes = 3;
}

message TransportHalfCloseRequest {
  uint32 stream_id = 1;
}

message TransportCloseRequest {
  uint32 stream_id = 1;
  string reason = 2;
}

message TransportClosedEvent {
  uint32 stream_id = 1;
  string reason = 2;
}

message TransportErrorEvent {
  uint32 stream_id = 1;
  string code = 2;
  string message = 3;
}
